<meta charset="utf-8">
<title>Vida Sim</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: full-screen 3D lot, Sims-style frosted panels floating at the screen edges (live bar bottom, clock top-right, queue top-left) */
:root{
  --sky:#a8dcf5;
  --panel:rgba(250,253,255,.93);
  --panel-solid:#fafdff;
  --ink:#16365c;
  --ink-soft:#56708f;
  --accent:#2a78d4;
  --accent-deep:#1a559e;
  --accent-soft:#e3f0fc;
  --plumbob:#3fd25c;
  --ok:#43c463;
  --warn:#f0b02c;
  --bad:#e2533e;
  --line:#d3e3f3;
  --font-display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --font-ui:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--font-ui);font-size:14px;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden;background:var(--sky)}
#view{position:absolute;inset:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.glass{background:var(--panel);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 28px rgba(22,54,92,.18),0 1px 0 rgba(255,255,255,.8) inset;border-radius:16px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#hud{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);gap:10px;
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud .pe{pointer-events:auto}
#topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.seg{display:flex;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:12px;padding:8px 14px;font-weight:800;color:var(--ink-soft);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(42,120,212,.35)}
.clockbox{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 14px;flex-wrap:wrap;justify-content:flex-end}
#money{font-family:var(--font-display);font-weight:600;font-size:18px;color:#1f8a3b;font-variant-numeric:tabular-nums;padding-right:6px}
#clock{font-weight:800;font-variant-numeric:tabular-nums;min-width:118px;text-align:right;padding-right:4px}
.iconbtn{border:0;background:var(--accent-soft);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--accent-deep)}
.iconbtn[aria-pressed="true"]{background:var(--accent);color:#fff}
.iconbtn svg{width:18px;height:18px;fill:currentColor}
#mid{position:relative;min-height:0}
#queue{position:absolute;left:0;top:0;display:flex;gap:6px;flex-wrap:wrap;max-width:60%}
.qitem{width:64px;padding:6px 4px 5px;border:0;text-align:center;font-size:10.5px;font-weight:800;line-height:1.15;color:var(--ink);position:relative}
.qitem .ring{width:38px;height:38px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--plumbob) var(--p,0%),#dfe9f3 0);}
.qitem .ring span{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px}
.qitem.first{outline:2px solid var(--plumbob)}
.qitem:hover::after{content:"✕";position:absolute;right:4px;top:3px;color:var(--bad);font-size:11px}
#toasts{position:absolute;right:0;top:0;display:flex;flex-direction:column;gap:8px;width:min(320px,70vw);pointer-events:none}
.toast{padding:10px 14px;display:flex;gap:10px;align-items:flex-start;animation:tin .35s ease-out}
.toast b{display:block;font-size:13.5px}
.toast p{margin:2px 0 0;color:var(--ink-soft);font-size:12.5px;line-height:1.35}
.toast .dot{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);font-size:15px}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
#camctl{position:absolute;right:0;bottom:0;display:flex;flex-direction:column;gap:6px;padding:6px}
/* bottom bars */
.bar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
#household{display:flex;flex-direction:column;gap:6px;padding:6px}
.hh{width:46px;height:46px;border-radius:50%;border:3px solid transparent;padding:0;background:#fff;overflow:hidden;position:relative}
.hh[aria-pressed="true"]{border-color:var(--plumbob)}
.hh.away::after{content:"Trabajo";position:absolute;inset:auto 0 0;font-size:8px;font-weight:900;background:var(--accent-deep);color:#fff}
.hh svg,.portrait svg{width:100%;height:100%;display:block}
#simcard{display:flex;gap:12px;align-items:center;padding:10px 14px 10px 10px;min-width:0}
.portrait{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff,#dbeaf8);border:4px solid var(--plumbob);flex:none;overflow:hidden}
#simname{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1.1}
#simmood{font-weight:800;font-size:13px;margin-top:2px}
#buffs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;max-width:230px}
.buff{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:#e8f8ec;color:#1d7a37}
.buff.neg{background:#fde9e5;color:#b23a26}
#panel{flex:1 1 420px;max-width:640px;min-width:0;padding:8px 12px 12px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
.tabs button{border:0;background:transparent;font-weight:800;color:var(--ink-soft);padding:6px 10px;border-radius:10px;white-space:nowrap;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-deep)}
#pbody{min-height:118px;max-height:190px;overflow-y:auto}
.needs{display:grid;grid-template-columns:1fr 1fr;gap:9px 18px}
.need label{display:flex;justify-content:space-between;font-weight:800;font-size:12.5px;margin-bottom:3px}
.need label span{color:var(--ink-soft);font-variant-numeric:tabular-nums;font-weight:700}
.meter{height:12px;border-radius:99px;background:#e1eaf3;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.meter i{display:block;height:100%;border-radius:99px;transition:width .4s,background .4s}
.rows{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:10px;font-size:13px}
.row .nm{width:110px;font-weight:800;flex:none}
.row .meter{flex:1}
.row .v{width:64px;text-align:right;color:var(--ink-soft);font-weight:700;font-variant-numeric:tabular-nums;font-size:12px}
.pips{display:flex;gap:3px;flex:1}
.pips i{flex:1;height:10px;border-radius:3px;background:#e1eaf3}
.pips i.on{background:var(--accent)}
.muted{color:var(--ink-soft)}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:900;background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(42,120,212,.3)}
.btn.ghost{background:var(--accent-soft);color:var(--accent-deep);box-shadow:none}
.btn.green{background:#2fb24f;box-shadow:0 3px 10px rgba(47,178,79,.35)}
.btn.small{padding:6px 11px;font-size:12px}
.wish{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#f0f6fd}
.wish .t{flex:1;font-weight:800;font-size:13px}
.wish .r{font-size:12px;color:#1f8a3b;font-weight:800}
.wish button{border:0;background:transparent;color:var(--ink-soft);font-size:16px;padding:0 4px}
/* buy & build */
#buybar,#buildbar{flex-direction:column;align-items:stretch;padding:10px 12px;gap:8px;width:100%;max-width:980px;justify-self:center}
.cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.cats button{border:0;background:#eef4fa;border-radius:10px;padding:6px 12px;font-weight:800;color:var(--ink-soft);white-space:nowrap;font-size:13px}
.cats button[aria-pressed="true"]{background:var(--accent);color:#fff}
.items{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.item{flex:none;width:104px;border:2px solid transparent;background:#fff;border-radius:14px;padding:6px 6px 8px;text-align:center;box-shadow:0 2px 6px rgba(22,54,92,.08)}
.item[aria-pressed="true"]{border-color:var(--accent)}
.item img{width:84px;height:84px;display:block;margin:0 auto;border-radius:10px;background:linear-gradient(#eef6fd,#dceaf7)}
.item .nm{display:block;font-size:11.5px;font-weight:800;line-height:1.15;margin-top:5px;min-height:27px}
.item .pr{display:block;font-size:12px;color:#1f8a3b;font-weight:900}
.toolrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);font-weight:700}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.tool{border:0;background:#eef4fa;border-radius:12px;padding:8px 12px;font-weight:800;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;min-width:72px}
.tool[aria-pressed="true"]{background:var(--accent);color:#fff}
.tool small{font-weight:700;opacity:.8}
.fl{width:46px;height:46px;border-radius:10px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0;background-size:cover}
.fl[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
/* pie menu */
#pie{position:absolute;inset:0;z-index:20}
#pie .hub{position:absolute;transform:translate(-50%,-50%);background:var(--accent-deep);color:#fff;font-weight:900;font-size:12px;padding:6px 12px;border-radius:99px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#pie .opt{position:absolute;transform:translate(-50%,-50%) scale(.6);opacity:0;border:0;background:var(--panel-solid);color:var(--ink);font-weight:800;font-size:13px;padding:9px 14px;border-radius:99px;white-space:nowrap;box-shadow:0 6px 18px rgba(22,54,92,.28);animation:pop .18s ease-out forwards}
#pie .opt:hover{background:var(--accent);color:#fff}
#pie .opt.off{color:#9aaabb}
#pie .opt.off:hover{background:#eef2f6;color:#8395a8}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1);opacity:1}}
/* in-world overlays */
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;border-radius:18px;padding:5px 10px;font-size:20px;box-shadow:0 4px 12px rgba(0,0,0,.2);white-space:nowrap}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.bub.zz{font-family:var(--font-display);font-weight:700;color:var(--accent-deep);font-size:16px}
.nametag{position:absolute;transform:translate(-50%,-100%);font-size:11px;font-weight:900;color:#fff;background:rgba(22,54,92,.7);padding:2px 8px;border-radius:99px;white-space:nowrap}
.float{position:absolute;transform:translate(-50%,-100%);font-family:var(--font-display);font-weight:700;font-size:18px;text-shadow:0 2px 0 #fff,0 0 6px #fff;animation:rise 1.8s ease-out forwards;white-space:nowrap}
@keyframes rise{to{transform:translate(-50%,-260%);opacity:0}}
/* screens */
.screen{position:absolute;inset:0;z-index:40}
#menu{display:grid;place-items:center;background:linear-gradient(180deg,rgba(168,220,245,.2),rgba(22,54,92,.35));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.menucard{padding:30px 34px 26px;text-align:center;width:min(420px,100%)}
.logo{font-family:var(--font-display);font-weight:700;font-size:54px;line-height:1;color:var(--accent-deep);letter-spacing:-.5px;margin:6px 0 4px}
.logo em{font-style:normal;color:#24a443}
.gem{width:34px;height:54px;margin:0 auto;background:linear-gradient(135deg,#9ff5ae,#2fc04e 55%,#1b8a34);clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);animation:spin 3s linear infinite}
@keyframes spin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.menucard p{color:var(--ink-soft);margin:8px 0 20px;line-height:1.45}
.menucard .stack{display:flex;flex-direction:column;gap:10px}
.menucard .btn{padding:13px 18px;font-size:16px}
#cas{display:grid;grid-template-columns:minmax(320px,440px) 1fr;background:radial-gradient(circle at 70% 40%,#e9f6ff,#b8def4 60%,#8fc4e6)}
#casPanel{overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));background:var(--panel);box-shadow:4px 0 24px rgba(22,54,92,.15);display:flex;flex-direction:column;gap:14px}
#casPanel h2{font-family:var(--font-display);font-weight:600;font-size:26px;margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-weight:900;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.field input[type=text]{border:2px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;font-weight:700;color:var(--ink);background:#fff;-webkit-user-select:text;user-select:text}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:#eef4fa;border-radius:99px;padding:7px 13px;font-weight:800;font-size:13px;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.chip small{display:block;font-weight:700;font-size:10.5px;opacity:.8}
.simtabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.simtab{width:52px;height:52px;border-radius:50%;padding:0;border:3px solid transparent;background:#fff;overflow:hidden}
.simtab[aria-pressed="true"]{border-color:var(--plumbob)}
.addsim{width:52px;height:52px;border-radius:50%;border:2px dashed var(--accent);background:transparent;color:var(--accent);font-size:24px;font-weight:900}
#casStage{position:relative;min-height:0}
#casStage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;touch-action:none}
#casStage .hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-weight:800;color:var(--ink-soft);background:var(--panel);padding:6px 14px;border-radius:99px;font-size:12.5px}
.casfoot{display:flex;gap:8px;position:sticky;bottom:-18px;background:var(--panel);padding:10px 0 4px;margin-top:auto}
.casfoot .btn{flex:1}
#modal{position:absolute;inset:0;z-index:60;display:grid;place-items:center;background:rgba(22,54,92,.35);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mcard{width:min(520px,100%);max-height:86vh;overflow:auto;padding:20px 22px}
.mcard h3{font-family:var(--font-display);font-weight:600;font-size:22px;margin:0 0 4px}
.mcard .list{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.opt-card{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;text-align:left}
.opt-card:hover{border-color:var(--accent)}
.opt-card b{display:block}
.opt-card small{color:var(--ink-soft);font-weight:700}
.opt-card .pay{color:#1f8a3b;font-weight:900;white-space:nowrap}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:12px 0}
.keys kbd{font:inherit;font-weight:900;background:#eef4fa;border-radius:6px;padding:1px 7px;white-space:nowrap}
@media (max-width:760px){
  .seg button{padding:7px 10px;font-size:13px}
  #clock{min-width:0;font-size:12.5px;flex:1}
  #money{font-size:16px}
  .clockbox{flex:1 1 100%;justify-content:flex-start;padding:5px 6px 5px 10px;gap:4px}
  .clockbox .iconbtn{width:30px;height:30px}
  #simcard{padding:8px 10px 8px 8px;gap:8px;flex:1 1 0}
  .portrait{width:56px;height:56px;border-width:3px}
  #simname{font-size:16px}
  #buffs{display:none}
  #panel{flex-basis:100%;max-width:none;order:3}
  #pbody{min-height:0;max-height:150px}
  #panel.collapsed #pbody{display:none}
  .needs{gap:7px 12px}
  #household{flex-direction:row;order:2}
  .hh{width:38px;height:38px}
  #queue{max-width:100%}
  .qitem{width:56px}
  #cas{grid-template-columns:1fr;grid-template-rows:38vh 1fr}
  #casStage{order:-1}
  #casPanel{box-shadow:0 -4px 24px rgba(22,54,92,.15)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>

<div id="app">
  <div id="view"></div>
  <div id="fx"></div>
  <div id="hud">
    <div id="topbar">
      <div class="seg glass pe" role="group" aria-label="Modo">
        <button data-mode="live" aria-pressed="true">Vivir</button>
        <button data-mode="buy" aria-pressed="false">Comprar</button>
        <button data-mode="build" aria-pressed="false">Construir</button>
      </div>
      <div class="clockbox glass pe">
        <span id="money">§0</span>
        <span id="clock">Dom 08:00</span>
        <button class="iconbtn" data-speed="0" title="Pausa (Espacio)" aria-label="Pausa"><svg viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg></button>
        <button class="iconbtn" data-speed="1" title="Velocidad normal (1)" aria-label="Velocidad normal"><svg viewBox="0 0 20 20"><path d="M6 3l11 7-11 7z"/></svg></button>
        <button class="iconbtn" data-speed="2" title="Rápido (2)" aria-label="Rápido"><svg viewBox="0 0 20 20"><path d="M2 4l8 6-8 6zM10 4l8 6-8 6z"/></svg></button>
        <button class="iconbtn" data-speed="3" title="Ultra rápido (3)" aria-label="Ultra rápido"><svg viewBox="0 0 20 20"><path d="M1 5l6 5-6 5zM7 5l6 5-6 5zM13 5l6 5-6 5z"/></svg></button>
        <button class="iconbtn" id="wallsBtn" title="Paredes: cortadas (T)" aria-label="Cambiar vista de paredes"><svg viewBox="0 0 20 20"><path d="M2 8h16v9H2z" opacity=".35"/><path d="M2 3h7v14H2z"/></svg></button>
        <button class="iconbtn" id="menuBtn" title="Menú" aria-label="Menú"><svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="2.4" rx="1.2"/><rect x="3" y="9" width="14" height="2.4" rx="1.2"/><rect x="3" y="14" width="14" height="2.4" rx="1.2"/></svg></button>
      </div>
    </div>
    <div id="mid">
      <div id="queue" class="pe"></div>
      <div id="toasts"></div>
      <div id="camctl" class="glass pe">
        <button class="iconbtn" data-cam="rl" title="Girar (Q)" aria-label="Girar a la izquierda"><svg viewBox="0 0 20 20"><path d="M10 3a7 7 0 1 1-6.6 9.3l2-.7A5 5 0 1 0 10 5v3L5 4l5-4z"/></svg></button>
        <button class="iconbtn" data-cam="rr" title="Girar (E)" aria-label="Girar a la derecha"><svg viewBox="0 0 20 20" style="transform:scaleX(-1)"><path d="M10 3a7 7 0 1 1-6.6 9.3l2-.7A5 5 0 1 0 10 5v3L5 4l5-4z"/></svg></button>
        <button class="iconbtn" data-cam="zi" title="Acercar (+)" aria-label="Acercar"><svg viewBox="0 0 20 20"><rect x="9" y="3" width="2.4" height="14" rx="1"/><rect x="3" y="8.8" width="14" height="2.4" rx="1"/></svg></button>
        <button class="iconbtn" data-cam="zo" title="Alejar (-)" aria-label="Alejar"><svg viewBox="0 0 20 20"><rect x="3" y="8.8" width="14" height="2.4" rx="1"/></svg></button>
      </div>
    </div>
    <div id="bottom">
      <div id="livebar" class="bar">
        <div id="household" class="glass pe"></div>
        <div id="simcard" class="glass pe">
          <div class="portrait" id="portrait"></div>
          <div style="min-width:0">
            <div id="simname">Sim</div>
            <div id="simmood">Bien</div>
            <div id="buffs"></div>
          </div>
        </div>
        <div id="panel" class="glass pe">
          <div class="tabs" role="tablist">
            <button data-tab="needs" aria-pressed="true">Necesidades</button>
            <button data-tab="skills" aria-pressed="false">Habilidades</button>
            <button data-tab="career" aria-pressed="false">Trabajo</button>
            <button data-tab="rels" aria-pressed="false">Relaciones</button>
            <button data-tab="wishes" aria-pressed="false">Deseos</button>
          </div>
          <div id="pbody"></div>
        </div>

  if(act.kind==='goto'||act.kind==='exit'){goals=[act.kind==='exit'?EXIT:it.tile];}

    const t=it.target;if(!t||t.atWork||(t.npc&&!t.present)){return 'No está disponible.';}
    if(t.cur&&t.cur.act.sleep)return t.first+' está durmiendo.';
    const tx=Math.floor(t.x),tz=Math.floor(t.z);
    for(const [dx,dz] of DIRS){const nx=tx+dx,nz=tz+dz;if(!blocked(nx,nz)&&!wallBetween(tx,tz,tx+dx,tz)&&!wallBetween(tx,tz,tx,tz+dz))goals.push({x:nx,z:nz});}
  }else{
    let o=it.obj;
    if(act.seatOptional&&!o){c.phase='do';c.useTile=st;return true;}
    if(!o||!state.objects.includes(o))return 'Ese objeto ya no existe.';
    if(act.seatNear){
      c.tv=o;const seat=findTVSeat(s,o);
      if(seat){c.seatObj=seat.o;reserve(c,seat.o,seat.i,s);c.seatIdx=seat.i;goals=useTiles(seat.o);}
      else{const f=FRONT[o.rot];goals=objTiles(o).map(t=>({x:t.x+f[0]*2,z:t.z+f[1]*2})).filter(t=>!blocked(t.x,t.z));}
    }else{
      if(!slotFree(o,act)){if(act.seatOptional){c.phase='do';c.useTile=st;c.it.obj=null;return true;}return 'Está ocupado.';}
      if(act.snap==='lieSide')reserve(c,o,'all',s);
      else if(act.snap){const i=freeSeat(o);reserve(c,o,i,s);c.seatIdx=i;}

      c.seatObj=o;goals=useTiles(o);

  const path=findPath(st.x,st.z,new Set(goals.map(tkey)));

}
function failCur(s,msg){if(s===state.active||!s.cur.it.auto){if(!s.npc&&!s.cur.it.auto)toast(s.first+' no puede hacerlo',msg,'🚫');}endCur(s,false);}
function endCur(s,ok){
  const c=s.cur;if(!c)return;s.cur=null;s.path=null;
  if(c.res){const {o,key}=c.res;if(o.users[key]===s)delete o.users[key];}
  if(c.tvOn&&c.tv)c.tv.watchers=Math.max(0,c.tv.watchers-1);
  if(c.screenOn&&c.it.obj)c.it.obj.watchers=Math.max(0,c.it.obj.watchers-1);
  if(c.partner){c.partner.lockedBy=null;c.partner.anim='idle';}
  if(s.snap){s.snap=null;if(c.useTile){s.x=c.useTile.x+.5;s.z=c.useTile.z+.5;}}
  s.anim='idle';
  if(ok){const a=c.act;if(a.onDone)a.onDone(s,c.it.obj,c);if(a.evt)emit(s,a.evt);if(a.buff)addBuff(s,a.buff);}
  else if(c.act.onCancel)c.act.onCancel(s,c);

}
function cancelAll(s){s.queue=[];if(s.cur)endCur(s,false);if(s.lockedBy){const p=s.lockedBy;if(p.cur&&p.cur.partner===s)endCur(p,false);s.lockedBy=null;}}
function face(s,x,z){s.rotY=Math.atan2(x-s.x,z-s.z);}
function arrive(s,c){
  const act=c.act,it=c.it;c.useTile={x:Math.floor(s.x),z:Math.floor(s.z)};
  if(act.kind==='goto'){endCur(s,true);return;}
  if(act.kind==='exit'){if(act.onArrive)act.onArrive(s);s.cur=null;s.anim='idle';return;}
  if(act.kind==='social'){
    const t=it.target;if(!t||t.atWork||Math.hypot(t.x-s.x,t.z-s.z)>1.9){if(++c.tries<3){c.phase='route';return;}failCur(s,'No logró alcanzar a '+(t?t.first:'')+'.');return;}
    if(t.lockedBy&&t.lockedBy!==s){failCur(s,t.first+' está ocupado.');return;}
    if(t.cur)endCur(t,false);
    t.lockedBy=s;c.partner=t;face(s,t.x,t.z);face(t,s.x,s.z);t.anim='talk';s.anim='talk';c.phase='do';return;
  }
  const o=c.seatObj||it.obj;
  if(c.seatObj&&(act.snap||act.seatNear&&c.seatIdx!=null||act.seatOptional)){
    if(act.snap==='lieSide'){const p=objCenter(o);s.snap={x:p.x,z:p.z,rot:o.rot*PI/2-PI/2,h:.45,pose:'lie'};}
    else{const sp=seatPos(o,c.seatIdx!=null?c.seatIdx:0);const pose=act.snap==='lie'?'lie':act.snap==='stand'?'stand':'sit';s.snap={x:sp.x,z:sp.z,rot:sp.rot,h:sp.h,pose};}
  }else if(o){const cc=objCenter(o);face(s,cc.x,cc.z);}
  if(c.tv){const tc=objCenter(c.tv);if(!s.snap)face(s,tc.x,tc.z);c.tv.watchers++;c.tvOn=true;}
  if(act.screen&&it.obj){it.obj.watchers++;c.screenOn=true;}
  c.phase='do';s.anim=act.anim||'idle';
}
function stepCur(s,dtG,dtM){
  const c=s.cur;
  if(c.phase==='route'){const r=planRoute(s,c);if(r!==true){failCur(s,r);return;}}
  if(c.phase==='walk'){
    s.anim='walk';
    if(followPath(s,dtM))arrive(s,c);
    return;
  }
  if(c.phase==='do'){
    const act=c.act;
    if(act.kind==='social'){socialStep(s,c,dtG);return;}
    if(c.useTile==null)c.useTile={x:Math.floor(s.x),z:Math.floor(s.z)};
    s.anim=act.anim||'idle';
    c.elapsed+=dtG;
    if(act.eff){const sm=hasTrait(s,'sociable');for(const n in act.eff){let g=act.eff[n]*dtG/60;if(n==='social'&&g>0)g*=traitMult(s,'social','x')*(sm?1.3:1);if(n==='fun'&&g>0&&c.tv&&hasTrait(s,'perezoso'))g*=1.4;s.needs[n]=clamp(s.needs[n]+g,0,100);}}
    if(act.skill)gainSkill(s,act.skill,dtG,act.skillRate);
    const doneUntil=act.until&&s.needs[act.until]>=99.5;
    if(doneUntil||c.elapsed>=act.dur)endCur(s,true);
  }
}
function socialStep(s,c,dtG){
  const t=c.partner;if(!t||t.atWork){endCur(s,false);return;}
  c.elapsed+=dtG;
  const g=c.it.soc;
  s.anim=(Math.floor(c.elapsed/3)%2)?'talk':'listen';t.anim=s.anim==='talk'?'listen':'talk';
  const bubbleTopic=['☀️','🍕','⚽','🎵','🐱','💡','🎮','🌴','📚','❤️'];
  if(!c.topic||c.elapsed-c.topicT>4){c.topic=g.neg?pick(['💢','😤','⚡']):pick(bubbleTopic);c.topicT=c.elapsed;}
  if(c.elapsed<20)return;
  const r=getRel(s,t);
  let p=g.p+skillLvl(s,'charisma')*.03+r.v/300+(moodOf(t)-50)/250;
  if(g.romance)p+=hasTrait(s,'romantico')?.2:0;
  if(g.needRom&&!r.rom)p-=.35;
  const ok=Math.random()<p;
  let dRel=ok?g.rel:-Math.abs(g.rel)*.6-3;
  if(g.neg){dRel=g.rel;addBuff(s,'pelea');addBuff(t,'pelea');}
  r.v=clamp(r.v+dRel,-100,100);
  if(ok&&g.romance){r.rom=true;}
  const sg=g.social*(hasTrait(s,'sociable')?1.3:1);
  s.needs.social=clamp(s.needs.social+sg,0,100);t.needs.social=clamp(t.needs.social+g.social*.8,0,100);
  if(g.fun&&ok){s.needs.fun=clamp(s.needs.fun+g.fun,0,100);t.needs.fun=clamp(t.needs.fun+g.fun,0,100);}
  gainSkill(s,'charisma',20,.6);
  floatText(s,(dRel>=0?'+':'')+Math.round(dRel),dRel>=0?'#1f8a3b':'#c0392b');
  if(ok&&!g.neg){addBuff(s,g.buff||'charla');if(g.buff)addBuff(t,g.buff);emit(s,'social');if(g.evt)emit(s,g.evt);}
  else if(!ok){addBuff(s,'rechazado');if(!s.npc)toast('No salió bien',t.first+' no reaccionó bien a «'+g.label.toLowerCase()+'».','😬');}
  if(g.id==='goodbye'){t.leaveNow=true;}
  endCur(s,true);
}
function followPath(s,dtM){
  if(!s.path||!s.path.length)return true;
  const n=s.path[0];
  if(blocked(n.x,n.z)){s.cur.phase='route';if(s.cur.res){const {o,key}=s.cur.res;delete o.users[key];s.cur.res=null;}return false;}
  const tx=n.x+.5,tz=n.z+.5,dx=tx-s.x,dz=tz-s.z,d=Math.hypot(dx,dz);
  const step=1.55*dtM;
  if(d<=step){s.x=tx;s.z=tz;s.path.shift();}else{s.x+=dx/d*step;s.z+=dz/d*step;}
  const want=Math.atan2(dx,dz);let diff=((want-s.rotY+PI*3)%(PI*2))-PI;s.rotY+=diff*Math.min(1,dtM*10);
  return !s.path.length;
}

/* ============ autonomy ============ */
function autonomy(s){
  const lowNeed=Math.min(...NEEDS.map(n=>s.needs[n.id]));
  const isCtrl=s===state.active;
  if(isCtrl&&(!state.freeWill||lowNeed>50||s.idleT<20))return;
  let best=null,bs=0;
  for(const o of state.objects){
    const def=CATALOG[o.type];
    for(const aid of def.actions){
      const act=ACT[aid];if(act.noAuto||(act.cond&&act.cond(s,o)!==true))continue;
      if(aid==='paint'&&!hasTrait(s,'creativo')&&Math.random()<.7)continue;
      if(s.npc&&['cook','grill','sleep','shower','bath','salad'].includes(aid))continue;
      if(!slotFree(o,act))continue;
      let sc=0;
      for(const n in act.eff||{}){const g=act.eff[n];if(g<=0)continue;const v=s.needs[n];const tot=act.until===n?100-v:Math.min(g*act.dur/60,100-v);sc+=tot*Math.pow((100-v)/100,2);}
      if(aid==='cook'||aid==='salad'||aid==='grill'){const v=s.needs.hunger;sc+=Math.min(65,100-v)*Math.pow((100-v)/100,2)*(s.needs.hunger<45?1:0.3);}
      if(sc<=0)continue;
      const cc=objCenter(o);const d=Math.hypot(cc.x-s.x,cc.z-s.z);
      sc=sc/(1+d*.06)*rand(.8,1.2);
      if(sc>bs){bs=sc;best={act,o};}
    }
  }
  if(s.needs.social<55){
    const others=presentSims().filter(o=>o!==s&&!o.lockedBy&&!(o.cur&&o.cur.act.sleep));
    if(others.length){const sc=(100-s.needs.social)*Math.pow((100-s.needs.social)/100,2)*.9*rand(.8,1.2);if(sc>bs){const t=pick(others);const r=getRel(s,t);const opts=SOCIALS.filter(g=>!g.neg&&!g.romance&&r.v>=g.min);enqueue(s,{kind:'social'},null,{target:t,soc:pick(opts),auto:true});return;}}
  }
  if(best&&bs>1.5){enqueue(s,best.act,best.o,{auto:true});return;}
  if(!isCtrl&&Math.random()<.4){for(let i=0;i<8;i++){const x=Math.floor(rand(3,15)),z=Math.floor(rand(2,11));if(!blocked(x,z)){enqueue(s,{kind:'goto',label:'Pasear'},null,{tile:{x,z},auto:true});break;}}}
}

const ACT_WORK={kind:'exit',label:'Ir al trabajo',onArrive:(s)=>{s.atWork=true;s.mesh.g.visible=false;s.workMood=moodOf(s);refreshHousehold();},onCancel:(s)=>{if(s.job){s.job.perf=clamp(s.job.perf-15,0,100);toast('Faltó al trabajo',s.first+' perdió el transporte. Rendimiento −15.','🚌');}}};
const ACT_LEAVE={kind:'exit',label:'Irse a casa',onArrive:(s)=>{s.present=false;s.mesh.g.visible=false;s.leaveNow=false;}};
function sendToWork(s){cancelAll(s);s.queue=[{act:ACT_WORK}];toast('Llegó el transporte',s.first+' sale para su trabajo de '+CAREERS[s.job.career].titles[s.job.level-1]+'.','🚌');if(s===state.active)refreshQueue();}
function returnFromWork(s){
  const C=CAREERS[s.job.career];const hrs=C.end-C.start;const pay=C.pay[s.job.level-1]*hrs;
  s.atWork=false;s.x=EXIT.x+.5;s.z=EXIT.z+.5;s.mesh.g.visible=true;
  s.needs.hunger=clamp(s.needs.hunger-28,5,100);s.needs.energy=clamp(s.needs.energy-25,5,100);s.needs.hygiene=clamp(s.needs.hygiene-22,5,100);s.needs.fun=clamp(s.needs.fun-20,5,100);s.needs.bladder=clamp(s.needs.bladder-30,10,100);s.needs.social=clamp(s.needs.social+10,0,100);
  const m=s.workMood||50;const dp=m>=60?22:m>=40?12:-8;s.job.perf=clamp(s.job.perf+dp,0,100);
  state.money+=pay;emit(s,'earn',pay);
  let msg=s.first+' volvió del trabajo y ganó '+money(pay)+'.';
  if(s.job.perf>=100&&s.job.level<6){
    const req=Math.ceil(s.job.level*1.5);const sk=skillLvl(s,C.skill);
    if(sk>=req){s.job.level++;s.job.perf=20;addBuff(s,'ascenso');msg+=' ¡Lo ascendieron a '+C.titles[s.job.level-1]+'!';}
    else msg+=' Para el ascenso necesita '+SKILLS.find(k=>k.id===C.skill).name+' nivel '+req+'.';
  }
  toast('De vuelta a casa',msg,'🏠');
  enqueue(s,{kind:'goto',label:'Entrar a casa'},null,{tile:ENTRY,auto:true});
  refreshHousehold();refreshPanel();
}
function onHour(hAbs){
  const hod=hAbs%24, day=Math.floor(hAbs/24), wd=day%7<5;
  for(const s of state.sims){if(!s.job)continue;const C=CAREERS[s.job.career];
    if(wd&&hod===C.start-1&&!s.atWork)sendToWork(s);
    if(s.atWork&&hod===C.end)returnFromWork(s);}
  if(hod===0){toast(DAYS_L[day%7],'Comienza el día '+(day-5)+'.','🌙');saveGame(true);}
  if(hod===9&&(day-6)%3===2){const b=Math.round(60+objValue()*.015);state.money-=b;toast('Facturas pagadas','Se descontaron '+money(b)+' de luz, agua y gas.','🧾');}
  if(hod===11&&!state.npcs.some(n=>n.present)&&Math.random()<.8){const n=pick(state.npcs);n.present=true;n.visitStart=state.time;n.x=EXIT.x+.5;n.z=EXIT.z+.5;n.mesh.g.visible=true;n.queue=[];n.cur=null;n.needs={hunger:80,energy:80,hygiene:80,bladder:80,fun:50,social:35};enqueue(n,{kind:'goto',label:'Llegar'},null,{tile:ENTRY,auto:true});toast('¡Visita!',n.first+' '+n.last+' vino a saludar.','👋');}
  if(hod===21)for(const n of state.npcs)if(n.present)n.leaveNow=true;

function critical(s){
  if(s.npc)return;
  const sl=s.cur&&s.cur.act;
  if(s.needs.bladder<=0&&!(sl&&sl===ACT.toilet)){cancelAll(s);s.needs.bladder=100;s.needs.hygiene=Math.max(0,s.needs.hygiene-40);addBuff(s,'avergonzado');toast('¡Accidente!',s.first+' no llegó al baño a tiempo. Qué vergüenza.','💦');addPuddle(s.x,s.z);}
  if(s.needs.energy<=0&&!(sl&&sl.sleep)){cancelAll(s);addBuff(s,'agotado');toast('¡Se desmayó!',s.first+' se quedó dormido en el suelo del cansancio.','😵');s.cur={it:{act:FAINT},act:FAINT,phase:'do',elapsed:0,useTile:{x:Math.floor(s.x),z:Math.floor(s.z)}};s.snap={x:s.x,z:s.z,rot:s.rotY,h:.05,pose:'lie'};}
  if(s.needs.hunger<=0){s.needs.hunger=25;s.needs.energy=Math.max(5,s.needs.energy-20);addBuff(s,'agotado');toast('¡Hambre extrema!',s.first+' se mareó de hambre. Dale de comer pronto.','🥴');}
}
const FAINT={label:'Desmayado',dur:180,eff:{energy:22},anim:'sleep',sleep:true,noAuto:true};
function addPuddle(x,z){const m=new THREE.Mesh(new THREE.CircleGeometry(.4,20),new THREE.MeshStandardMaterial({color:'#9fd6ef',transparent:true,opacity:.7,roughness:.05}));m.rotation.x=-PI/2;m.position.set(x,.01,z);fxGroup.add(m);state.puddles.push({m,until:state.time+180});}

/* ============ sim update & animation ============ */
function updateSim(s,dtG,dtM,dtR){
  if(s.atWork||(s.npc&&!s.present))return;
  for(let i=s.buffs.length-1;i>=0;i--)if(s.buffs[i].until<state.time)s.buffs.splice(i,1);
  const sleeping=s.cur&&s.cur.phase==='do'&&s.cur.act.sleep;
  for(const n of NEEDS){if(sleeping&&n.id==='energy')continue;let d=n.decay*traitMult(s,'decay',n.id)*dtG/60;if(sleeping)d*=.35;if(n.id==='social'&&s.lockedBy)d=0;s.needs[n.id]=clamp(s.needs[n.id]-d,0,100);}
  critical(s);
  if(s.npc&&s.leaveNow&&!s.lockedBy&&!(s.cur&&s.cur.act===ACT_LEAVE)){cancelAll(s);s.queue=[{act:ACT_LEAVE}];s.leaveNow=false;}
  if(s.lockedBy){/* being talked to */}
  else{
    if(!s.cur&&s.queue.length)startNext(s);
    if(s.cur)stepCur(s,dtG,dtM);
    else{s.anim='idle';s.idleT+=dtG;s.autoT-=dtG;if(s.autoT<=0){s.autoT=rand(4,9);autonomy(s);}}
  }
  animateSim(s,dtR);
}
function animateSim(s,dt){
  const M=s.mesh,g=M.g;s.animT+=dt*(s.anim==='run'?1.8:1);
  const t=s.animT, a=s.anim;
  M.body.position.set(0,0,0);M.body.rotation.set(0,0,0);M.head.rotation.set(0,0,0);
  M.legs.forEach(l=>l.rotation.set(0,0,0));M.arms.forEach(l=>l.rotation.set(0,0,0));
  let x=s.x,z=s.z,y=0,ry=s.rotY;
  if(s.snap){x=s.snap.x;z=s.snap.z;ry=s.snap.rot;y=0;
    if(s.snap.pose==='sit'){M.body.position.y=s.snap.h-.86;M.legs.forEach(l=>l.rotation.x=-1.45);}
    else if(s.snap.pose==='lie'){M.body.rotation.x=-PI/2;M.body.position.y=s.snap.h+.1;M.body.position.z=.82;M.arms.forEach((l,i)=>l.rotation.z=(i?-1:1)*.1);}
    else{y=s.snap.h;}
  }
  g.position.set(x,y,z);
  let dr=((ry-g.rotation.y+PI*3)%(PI*2))-PI;g.rotation.y+=dr*Math.min(1,dt*12);
  const sw=Math.sin(t*9);
  if(a==='walk'||a==='run'){const k=a==='run'?.8:.55;M.legs[0].rotation.x=sw*k;M.legs[1].rotation.x=-sw*k;M.arms[0].rotation.x=-sw*k*.8;M.arms[1].rotation.x=sw*k*.8;M.body.position.y=Math.abs(Math.cos(t*9))*.03;}
  else if(a==='sleep'){M.body.position.y+=Math.sin(t*1.5)*.006;}
  else if(a==='eat'){M.arms[1].rotation.x=-1.6+Math.max(0,Math.sin(t*2.5))*-.6;M.arms[0].rotation.x=-.5;}
  else if(a==='cook'||a==='wash'){M.arms[0].rotation.x=-1+Math.sin(t*6)*.2;M.arms[1].rotation.x=-1-Math.sin(t*6)*.2;M.head.rotation.x=.3;}
  else if(a==='type'){M.arms[0].rotation.x=-1.25+Math.sin(t*14)*.06;M.arms[1].rotation.x=-1.25-Math.sin(t*14)*.06;}
  else if(a==='read'){M.arms[0].rotation.x=-1.2;M.arms[1].rotation.x=-1.2;M.arms[0].rotation.z=-.3;M.arms[1].rotation.z=.3;M.head.rotation.x=.35;}
  else if(a==='talk'){M.arms[0].rotation.x=-.5+Math.sin(t*4)*.35;M.arms[1].rotation.x=-.3+Math.cos(t*3)*.3;M.head.rotation.x=Math.sin(t*5)*.06;}
  else if(a==='listen'){M.head.rotation.x=Math.sin(t*2)*.08;M.arms[0].rotation.z=.08;}
  else if(a==='dance'){M.body.position.y=Math.abs(Math.sin(t*6))*.08;M.arms[0].rotation.z=2.4+Math.sin(t*6)*.4;M.arms[1].rotation.z=-2.4-Math.sin(t*6)*.4;M.body.rotation.y=Math.sin(t*3)*.4;M.legs[0].rotation.x=Math.sin(t*6)*.3;}
  else if(a==='sway'){M.body.rotation.z=Math.sin(t*3)*.05;M.head.rotation.z=Math.sin(t*3)*.12;}
  else if(a==='shower'){M.arms[0].rotation.x=-2.6+Math.sin(t*5)*.2;M.arms[1].rotation.x=-2.6-Math.sin(t*5)*.2;}
  else if(a==='paint'){M.arms[1].rotation.x=-1.4+Math.sin(t*3)*.3;M.arms[1].rotation.z=Math.cos(t*3)*.2;M.arms[0].rotation.x=-.6;}
  else if(a==='watch'){if(!s.snap){M.arms[0].rotation.z=.1;}}
  else{M.body.position.y+=Math.sin(t*2)*.004;M.arms[0].rotation.z=.06;M.arms[1].rotation.z=-.06;}
  if(s.snap&&s.snap.pose==='sit'&&a!=='type'&&a!=='eat'&&a!=='talk'&&a!=='listen'){M.arms.forEach(l=>l.rotation.x=-.6);}
}

/* ============ camera ============ */
const cam={yaw:.75,pitch:.82,dist:24,tx:9,tz:7.5};
function applyCam(){cam.pitch=clamp(cam.pitch,.32,1.42);cam.dist=clamp(cam.dist,5,48);cam.tx=clamp(cam.tx,-4,LOT_W+4);cam.tz=clamp(cam.tz,-4,LOT_D+6);
  camera.position.set(cam.tx+Math.sin(cam.yaw)*Math.cos(cam.pitch)*cam.dist,Math.sin(cam.pitch)*cam.dist,cam.tz+Math.cos(cam.yaw)*Math.cos(cam.pitch)*cam.dist);camera.lookAt(cam.tx,0.6,cam.tz);}
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);
function pan(dx,dy){const k=cam.dist*.0016;const rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw),fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw);cam.tx+=-rx*dx*k+fx*dy*k;cam.tz+=-rz*dx*k+fz*dy*k;}

/* ============ sky / lights ============ */
const C_NIGHT=new THREE.Color('#132650'),C_DAWN=new THREE.Color('#f3a46f'),C_DAY=new THREE.Color('#a8dcf5');
function updateSky(){
  const hf=(state.time%1440)/60;const e=Math.sin(PI*(hf-6)/14);const el=Math.max(0,e);
  const col=new THREE.Color();
  if(e<=0)col.copy(C_NIGHT);else if(e<.25)col.copy(C_NIGHT).lerp(C_DAWN,e/.25);else col.copy(C_DAWN).lerp(C_DAY,Math.min(1,(e-.25)/.35));
  scene.background.copy(col);scene.fog.color.copy(col);
  sun.intensity=.1+.8*el;hemi.intensity=.28+.5*el;amb.intensity=.12+.08*el;
  const az=PI*(hf-6)/14;sun.position.set(LOT_W/2+Math.cos(az)*22,4+el*24,LOT_D/2-10+Math.sin(az)*4);
  const night=hf<6.5||hf>=19;
  for(const o of state.objects){
    if(o._light){const on=o.on&&night;o._light.intensity=on?1.1:0;o._shade.material.emissive.set(on?'#ffcf7a':'#000000');}
    if(o._screen){const on=o.watchers>0;o._screen.material.emissive.set(on?'#4a9fe8':'#000000');o._screen.material.emissiveIntensity=on?.6+Math.sin(performance.now()/300)*.15:0;}
  }
}

/* ============ default lot ============ */
function defaultLot(){
  state.floors=new Array(LOT_W*LOT_D).fill('grass');
  const fill=(x0,z0,x1,z1,p)=>{for(let x=x0;x<x1;x++)for(let z=z0;z<z1;z++)state.floors[x+z*LOT_W]=p;};
  fill(3,2,10,11,'wood');fill(10,2,15,6,'tile');fill(10,6,15,11,'carpet');fill(6,11,7,16,'stone');fill(15,7,19,10,'stone');
  const W=(t,x,z,o)=>state.walls.set(wkey(t,x,z),Object.assign({color:'#f2ebdd'},o||{}));
  for(let x=3;x<15;x++){W('h',x,2);W('h',x,11);}
  for(let z=2;z<11;z++){W('v',3,z);W('v',15,z);}
  for(let z=2;z<11;z++)W('v',10,z,{color:'#f7f3ea'});
  for(let x=10;x<15;x++)W('h',x,6,{color:'#dbeaf3'});
  const set=(t,x,z,o)=>Object.assign(state.walls.get(wkey(t,x,z)),o);
  set('h',6,11,{door:true});set('v',10,4,{door:true});set('v',10,8,{door:true});set('v',15,8,{door:true});
  [['h',4,2],['h',8,2],['h',12,2],['v',3,4],['v',3,8],['h',8,11],['h',12,11],['h',4,11],['v',15,4]].forEach(w=>set(w[0],w[1],w[2],{window:true}));
  const A=(t,x,z,r,c)=>addObject(t,x,z,r,c);
  A('fridge',3,2,0);A('stove',4,2,0);A('counter',5,2,0);A('ksink',6,2,0);A('counter',7,2,0);
  A('table',5,4,0);A('dchair',5,5,2);A('dchair',6,5,2);A('dchair',4,4,1);
  A('sofa',3,7,1);A('tv',7,7,3);A('rug',4,7,0,'#c45c48');A('lamp',3,9,0);A('plant',3,6,0);
  A('desk',9,3,3);A('book',9,9,3);A('stereo',9,6,3);A('plant',9,10,0);
  A('toilet',11,2,0);A('sink',12,2,0);A('shower',14,2,0);A('plant',10,5,0,'#6aa83a');
  A('bed',13,6,0);A('dresser',11,6,0);A('mirror',10,10,2);A('easel',12,10,2);A('lamp',14,10,0,'#f4e6c8');
  A('tread',17,7,0);A('grill',16,9,0);
  A('tree',1,3,0);A('tree',18,3,0);A('tree',1,12,0);A('tree',17,13,0,'#d97a2b');A('flowers',4,12,0);A('flowers',8,12,0,'#ff8fb1');A('flowers',8,13,0,'#8e5bd6');
}

/* ============ save / load ============ */
const SIM_FIELDS=['id','first','last','body','height','skin','hair','hairStyle','eyes','top','bottom','bottomType','shoes','traits','npc','needs','skills','buffs','job','wishes','x','z','atWork','present','rotY'];
function serialize(){
  if(!state||!state.started)return null;
  const ss=s=>{const o={};SIM_FIELDS.forEach(k=>o[k]=s[k]);return o;};
  return {v:1,time:state.time,money:state.money,freeWill:state.freeWill,wallMode:state.wallMode,family:state.family,nextId:state.nextId,
    sims:state.sims.map(ss),npcs:state.npcs.map(ss),rels:state.rels,activeId:state.active&&state.active.id,
    objects:state.objects.map(o=>({type:o.type,x:o.x,z:o.z,rot:o.rot,color:o.color,on:o.on})),walls:[...state.walls.entries()],floors:state.floors,cam:{...cam}};
}
function saveGame(silent){const d=serialize();if(!d)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify(d));if(!silent)toast('Partida guardada','Puedes continuar cuando quieras desde el menú.','💾');}catch(e){if(!silent)toast('No se pudo guardar','Tu navegador no permite guardar aquí.','⚠️');}}
function readSave(){try{const t=localStorage.getItem(SAVE_KEY);return t?JSON.parse(t):null;}catch(e){return null;}}
function clearWorld(){
  objGroup.clear();simGroup.clear();wallGroup.clear();fxGroup.clear();$('#fx').innerHTML='';
}
function loadGame(d){
  clearWorld();state=freshState();
  Object.assign(state,{time:d.time,money:d.money,freeWill:d.freeWill!==false,wallMode:d.wallMode||'cut',family:d.family||'',nextId:d.nextId||100,rels:d.rels||{}});
  state.floors=d.floors;state.walls=new Map(d.walls);
  for(const o of d.objects){const ob=addObject(o.type,o.x,o.z,o.rot,o.color);ob.on=o.on!==false;}
  state.nextId=Math.max(state.nextId,(d.nextId||0));
  state.sims=d.sims.map(s=>initSimRuntime(s));state.npcs=(d.npcs||[]).map(s=>initSimRuntime(s));
  state.active=state.sims.find(s=>s.id===d.activeId)||state.sims[0];
  state.lastHour=Math.floor(state.time/60);
  if(d.cam)Object.assign(cam,d.cam);
  buildFloors();computeWallBounds();rebuildWalls(true);
  state.started=true;enterGame();
}
function newGame(household,family){
  clearWorld();state=freshState();state.family=family;defaultLot();
  let id=1;
  state.sims=household.map((d,i)=>{d.id=id++;d.last=family;d.x=ENTRY.x+.5+(i%2)*1;d.z=ENTRY.z+.5-Math.floor(i/2);return initSimRuntime(d);});
  state.npcs=[0,1,2].map(i=>{const d=newSimData({npc:true});d.id=id++;d.last=pick(LASTS.filter(l=>l!==family));d.present=false;d.first=d.first;return initSimRuntime(d);});
  state.nextId=Math.max(state.nextId,id+10);
  for(let i=0;i<state.sims.length;i++)for(let j=i+1;j<state.sims.length;j++)getRel(state.sims[i],state.sims[j]).v=50;
  state.active=state.sims[0];state.lastHour=Math.floor(state.time/60);
  buildFloors();computeWallBounds();rebuildWalls(true);
  state.started=true;enterGame();
  setTimeout(()=>toast('¡Bienvenidos!','La familia '+family+' se mudó. Haz clic en un objeto para ver qué pueden hacer.','🏡'),400);
  setTimeout(()=>toast('Consejo','Busca empleo en la computadora para ganar dinero cada día.','💡'),3200);
}

/* ============ UI: toasts, floats ============ */
function toast(title,text,icon){const t=el('div','toast glass','<div class="dot">'+(icon||'ℹ️')+'</div><div><b></b><p></p></div>');t.querySelector('b').textContent=title;t.querySelector('p').textContent=text;const box=$('#toasts');box.prepend(t);while(box.children.length>4)box.lastChild.remove();setTimeout(()=>t.remove(),6500);}
const vtmp=new THREE.Vector3();
function project(x,y,z){vtmp.set(x,y,z).project(camera);return {x:(vtmp.x+1)/2*view.clientWidth,y:(1-vtmp.y)/2*view.clientHeight,vis:vtmp.z<1};}
function headPos(s){const g=s.mesh.g;const lie=s.snap&&s.snap.pose==='lie';return {x:g.position.x,y:g.position.y+(lie?1.0:(s.snap&&s.snap.pose==='sit'?1.75:2.25))*(s.height||1),z:g.position.z};}
function floatText(s,txt,color){if(!s.mesh)return;const h=headPos(s);const p=project(h.x,h.y,h.z);const f=el('div','float');f.textContent=txt;f.style.color=color;f.style.left=p.x+'px';f.style.top=p.y+'px';$('#fx').appendChild(f);setTimeout(()=>f.remove(),1800);}
function updateOverlays(){
  for(const s of allSims()){
    const vis=s.mesh.g.visible;
    let content=null,zz=false;
    if(vis){
      if(s.cur&&s.cur.phase==='do'&&s.cur.act.sleep){content='Z z z';zz=true;}
      else if(s.cur&&s.cur.act.kind==='social'&&s.cur.phase==='do'&&s.cur.topic){content=s.cur.topic;}
      else{let low=null;for(const n of NEEDS)if(s.needs[n.id]<22&&(!low||s.needs[n.id]<s.needs[low.id]))low=n;if(low&&!s.npc)content=low.icon;}
    }
    if(content){const h=headPos(s);const p=project(h.x,h.y+.35,h.z);s.bub.hidden=!p.vis;s.bub.style.left=p.x+'px';s.bub.style.top=p.y+'px';if(s.bub._c!==content){s.bub.textContent=content;s.bub._c=content;s.bub.className='bub'+(zz?' zz':'');}}
    else s.bub.hidden=true;
    const showTag=vis&&(s.npc||state.mode!=='live'?false:true)&&s!==state.active&&!content;
    if(vis&&s.npc&&!content){const h=headPos(s);const p=project(h.x,h.y+.15,h.z);s.tag.hidden=!p.vis;s.tag.style.left=p.x+'px';s.tag.style.top=p.y+'px';}
    else if(showTag){const h=headPos(s);const p=project(h.x,h.y+.15,h.z);s.tag.hidden=!p.vis;s.tag.style.left=p.x+'px';s.tag.style.top=p.y+'px';}
    else s.tag.hidden=true;
  }
}

function faceSVG(d){

  if(hs==='largo')back=`<path d="M12 32 Q10 58 18 62 L46 62 Q54 58 52 32 Z" fill="${h}"/>`;
  if(hs==='afro')back=`<circle cx="32" cy="26" r="24" fill="${h}"/>`;
  if(hs==='coleta')back=`<circle cx="52" cy="26" r="7" fill="${h}"/>`;
  if(hs==='mono')back=`<circle cx="32" cy="8" r="8" fill="${h}"/>`;
  if(hs!=='afro')front=hs==='rapado'?`<path d="M14 30 Q14 12 32 12 Q50 12 50 30 Q44 20 32 20 Q20 20 14 30Z" fill="${h}" opacity=".85"/>`:`<path d="M12 34 Q11 10 32 10 Q53 10 52 34 Q48 22 38 20 Q30 26 18 24 Q14 28 12 34Z" fill="${h}"/>`;
  else front=`<path d="M12 30 Q14 8 32 8 Q50 8 52 30 Q44 18 32 18 Q20 18 12 30Z" fill="${h}"/>`;
  return `<svg viewBox="0 0 64 64">${back}<rect x="26" y="50" width="12" height="10" fill="${sk}"/><path d="M8 64 Q10 54 32 54 Q54 54 56 64Z" fill="${d.top}"/><ellipse cx="32" cy="34" rx="19" ry="21" fill="${sk}"/>${front}<circle cx="25" cy="35" r="3.2" fill="#fff"/><circle cx="39" cy="35" r="3.2" fill="#fff"/><circle cx="25" cy="35.5" r="1.9" fill="${d.eyes}"/><circle cx="39" cy="35.5" r="1.9" fill="${d.eyes}"/><path d="M26 45 Q32 49 38 45" stroke="#a0524a" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
}

const pie=$('#pie');
function openPie(sx,sy,title,opts){
  pie.innerHTML='';pie.hidden=false;
  const W=window.innerWidth,H=window.innerHeight;const n=opts.length;const R=n<=3?72:n<=5?92:n<=7?112:128;
  const cx=clamp(sx,R+80,W-R-80),cy=clamp(sy,R+40,H-R-40);

function vertexAt(p){return {x:clamp(Math.round(p.x),0,LOT_W),z:clamp(Math.round(p.z),0,LOT_D)};}
function segsBetween(a,b){const out=[];if(Math.abs(b.x-a.x)>=Math.abs(b.z-a.z)){const z=a.z;for(let x=Math.min(a.x,b.x);x<Math.max(a.x,b.x);x++)if(x<LOT_W)out.push(['h',x,z]);}else{const x=a.x;for(let z=Math.min(a.z,b.z);z<Math.max(a.z,b.z);z++)if(z<LOT_D)out.push(['v',x,z]);}return out;}

function edgeAt(p){const fx=p.x-Math.floor(p.x),fz=p.z-Math.floor(p.z);const dx=Math.min(fx,1-fx),dz=Math.min(fz,1-fz);return dz<dx?['h',Math.floor(p.x),Math.round(p.z)]:['v',Math.round(p.x),Math.floor(p.z)];}

function buildDown(cx,cy){

function paintFloorAt(g){const x=Math.floor(g.x),z=Math.floor(g.z);if(!inLot(x,z))return;if(state.floors[x+z*LOT_W]===floorPat)return;if(state.money<10){toast('Fondos insuficientes','No alcanza para más suelo.','💸');return;}if(setFloor(x,z,floorPat)){state.money-=10;}}

function openJobs(s){
  const prevSpeed=state.speed;state.speed=0;refreshSpeed();
  let h=`<h3>Ofertas de empleo</h3><p class="muted" style="margin:0">Elige una carrera para ${s.first}. Se trabaja de lunes a viernes; el transporte pasa una hora antes.</p><div class="list">`;
  for(const k in CAREERS){const C=CAREERS[k];h+=`<button class="opt-card" data-c="${k}"><span><b>${C.name}: ${C.titles[0]}</b><small>${C.start}:00 a ${C.end}:00 · sube con ${SKILLS.find(x=>x.id===C.skill).name}</small></span><span class="pay">${money(C.pay[0])}/h</span></button>`;}
  h+=`</div><button class="btn ghost" id="mclose">Ahora no</button>`;openModal(h);
  $('#mclose').onclick=()=>{closeModal();state.speed=prevSpeed;refreshSpeed();};
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const k=b.dataset.c;s.job={career:k,level:1,perf:20};toast('¡Contratado!',s.first+' empieza como '+CAREERS[k].titles[0]+'.','💼');closeModal();state.speed=prevSpeed||1;refreshSpeed();panelTab='career';refreshPanel();});
}
function openHelp(){openModal(`<h3>Cómo se juega</h3><p class="muted" style="margin:0">Cuida a tus Sims: mantén sus barras de necesidad en verde y estarán felices.</p>
<div class="keys"><kbd>Clic</kbd><span>en un objeto o Sim para ver qué pueden hacer</span><kbd>Arrastrar</kbd><span>mover la cámara</span><kbd>Clic derecho + arrastrar</kbd><span>girar la cámara (o Q / E)</span><kbd>Rueda</kbd><span>acercar o alejar</span><kbd>Espacio, 1, 2, 3</kbd><span>pausa y velocidades</span><kbd>T</kbd><span>paredes cortadas, bajas o altas</span><kbd>F1 F2 F3</kbd><span>modos Vivir, Comprar y Construir</span><kbd>R</kbd><span>girar el objeto que colocas</span><kbd>Esc</kbd><span>cancelar</span></div>
<p class="muted" style="font-size:13px;line-height:1.45">Consigue empleo en la computadora, sube habilidades (cocina, lógica, carisma, creatividad, forma física) para ascender, cumple deseos para ganar bonos y haz amigos con las visitas. Si ignoras la vejiga o la energía… habrá accidentes. La partida se guarda sola cada medianoche.</p><button class="btn" id="mclose">Entendido</button>`);$('#mclose').onclick=closeModal;}
function openMenuModal(){
  const prev=state.speed;state.speed=0;refreshSpeed();
  openModal(`<h3>Menú</h3><div class="list"><button class="opt-card" id="m1"><b>Guardar partida</b></button><button class="opt-card" id="m2"><span><b>Agregar un Sim al hogar</b><small>Hasta 4 Sims</small></span></button><button class="opt-card" id="m5"><span><b>Libre albedrío: ${state.freeWill?'activado':'desactivado'}</b><small>Tu Sim actúa solo cuando lo necesita</small></span></button><button class="opt-card" id="m3"><b>Cómo se juega</b></button><button class="opt-card" id="m4"><span><b>Salir al menú principal</b><small>Se guarda antes de salir</small></span></button></div><button class="btn ghost" id="mclose">Volver al juego</button>`);
  const back=()=>{closeModal();state.speed=prev;refreshSpeed();};
  $('#mclose').onclick=back;$('#m1').onclick=()=>{saveGame();back();};
  $('#m2').onclick=()=>{if(state.sims.length>=4){toast('Hogar completo','El hogar ya tiene 4 Sims.','🏠');return;}closeModal();openCAS('add');};
  $('#m3').onclick=openHelp;$('#m5').onclick=()=>{state.freeWill=!state.freeWill;openMenuModal();};
  $('#m4').onclick=()=>{saveGame(true);closeModal();showMenu();};
}
$('#menuBtn').onclick=openMenuModal;

/* ============ CAS ============ */
const casR=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});casR.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
const casScene=new THREE.Scene();casScene.add(new THREE.HemisphereLight(0xffffff,0x9ab0c8,.9));const cl=new THREE.DirectionalLight(0xffffff,.7);cl.position.set(2,4,3);casScene.add(cl);
const casCam=new THREE.PerspectiveCamera(30,1,.1,50);casCam.position.set(0,1.25,4.6);casCam.lookAt(0,.95,0);
const ped=new THREE.Group();cyl(ped,.65,.7,.12,'#ffffff',0,-.12,0,40);casScene.add(ped);
let casOpen=false,casMode='new',casList=[],casIdx=0,casMesh=null,casYaw=0,casEdit=null;
function openCAS(mode,editSim){
  casMode=mode;casOpen=true;$('#cas').hidden=false;$('#menu').hidden=true;
  if(mode==='new'){casList=[newSimData({body:'f'}),newSimData({body:'m'})];casList[0].hairStyle='largo';casIdx=0;$('#casFamily').value=pick(LASTS);}
  else if(mode==='add'){casList=[newSimData()];casIdx=0;}
  else{casEdit=editSim;casList=[Object.assign({},editSim,{traits:[...editSim.traits]})];casIdx=0;}
  $('#famField').hidden=mode!=='new';
  $('#casDone').textContent=mode==='new'?'Mudarse':mode==='add'?'Agregar al hogar':'Guardar cambios';
  if(state&&state.started){state.casPrevSpeed=state.speed;state.speed=0;}
  $('#casStage').appendChild(casR.domElement);
  renderCAS();casResize();
}
function casResize(){const st=$('#casStage');const w=st.clientWidth||400,h=st.clientHeight||400;casR.setSize(w,h,false);casCam.aspect=w/h;casCam.updateProjectionMatrix();}
window.addEventListener('resize',()=>{if(casOpen)casResize();});
function casSwatches(id,list,key){const box=$(id);box.innerHTML='';const d=casList[casIdx];list.forEach(c=>{const b=el('button','sw');b.style.background=c;b.setAttribute('aria-pressed',d[key]===c);b.setAttribute('aria-label','Color');b.onclick=()=>{d[key]=c;renderCAS();};box.appendChild(b);});}
function casChips(id,list,key){const box=$(id);box.innerHTML='';const d=casList[casIdx];list.forEach(([v,n])=>{const b=el('button','chip',n);b.setAttribute('aria-pressed',d[key]===v);b.onclick=()=>{d[key]=v;renderCAS();};box.appendChild(b);});}
function renderCAS(){
  const d=casList[casIdx];
  const tabs=$('#casTabs');tabs.innerHTML='';
  if(casMode==='new'){casList.forEach((s,i)=>{const b=el('button','simtab',faceSVG(s));b.title=s.first;b.setAttribute('aria-pressed',i===casIdx);b.onclick=()=>{casIdx=i;renderCAS();};tabs.appendChild(b);});
    if(casList.length<4){const a=el('button','addsim','+');a.title='Agregar Sim';a.setAttribute('aria-label','Agregar Sim');a.onclick=()=>{casList.push(newSimData());casIdx=casList.length-1;renderCAS();};tabs.appendChild(a);}
    if(casList.length>1){const r=el('button','chip','Quitar a '+d.first);r.onclick=()=>{casList.splice(casIdx,1);casIdx=0;renderCAS();};tabs.appendChild(r);}}
  $('#casName').value=d.first;$('#casHeight').value=Math.round(d.height*100);
  casChips('#casBody',[['f','Femenino'],['m','Masculino']],'body');
  casSwatches('#casSkin',SKIN,'skin');casChips('#casHairS',HAIR_S,'hairStyle');casSwatches('#casHairC',HAIR_C,'hair');casSwatches('#casEyes',EYES,'eyes');
  casSwatches('#casTop',CLOTH,'top');casChips('#casBotT',BOTT,'bottomType');casSwatches('#casBot',CLOTH,'bottom');casSwatches('#casShoes',['#23272e','#f4f4f4','#7a4b2a','#e2533e','#2a78d4','#f0b02c'],'shoes');
  const tb=$('#casTraits');tb.innerHTML='';for(const k in TRAITS){const b=el('button','chip',TRAITS[k].name+'<small>'+TRAITS[k].desc+'</small>');b.setAttribute('aria-pressed',d.traits.includes(k));b.onclick=()=>{if(d.traits.includes(k))d.traits=d.traits.filter(t=>t!==k);else{d.traits.push(k);if(d.traits.length>2)d.traits.shift();}renderCAS();};tb.appendChild(b);}
  if(casMesh)casScene.remove(casMesh.g);casMesh=buildSimMesh(d);casScene.add(casMesh.g);
}
$('#casName').addEventListener('input',e=>{casList[casIdx].first=e.target.value||'Sim';});
$('#casName').addEventListener('change',()=>renderCAS());
$('#casHeight').addEventListener('input',e=>{casList[casIdx].height=e.target.value/100;if(casMesh)casMesh.g.scale.setScalar(casList[casIdx].height);});
$('#casRandom').onclick=()=>{const keep=casList[casIdx];const n=newSimData();n.first=keep.first;casList[casIdx]=n;renderCAS();};
$('#casDone').onclick=()=>{
  for(const d of casList){if(!d.first||!d.first.trim())d.first='Sim';if(d.traits.length<1){toast('Faltan rasgos','Elige al menos un rasgo para '+d.first+'.','🧩');return;}}
  casOpen=false;$('#cas').hidden=true;
  if(casMode==='new'){const fam=($('#casFamily').value||'Sim').trim();newGame(casList,fam);}
  else if(casMode==='add'){const d=casList[0];d.id=state.nextId++;d.last=state.family;d.x=ENTRY.x+.5;d.z=ENTRY.z+.5;const s=initSimRuntime(d);for(const o of state.sims)getRel(s,o).v=50;state.sims.push(s);refreshHousehold();toast('¡Nuevo integrante!',s.first+' se mudó con la familia.','🏠');state.speed=state.casPrevSpeed||1;refreshSpeed();}
  else{const d=casList[0],s=casEdit;['first','body','height','skin','hair','hairStyle','eyes','top','bottom','bottomType','shoes','traits'].forEach(k=>s[k]=d[k]);rebuildSim(s);s.tag.textContent=s.first;refreshHousehold();refreshCard();state.speed=state.casPrevSpeed||1;refreshSpeed();}
};
(function casDrag(){let down=null;casR.domElement.addEventListener('pointerdown',e=>{down=e.clientX;});window.addEventListener('pointermove',e=>{if(down!=null){casYaw+=(e.clientX-down)*.01;down=e.clientX;}});window.addEventListener('pointerup',()=>down=null);})();

/* ============ thumbnails ============ */
function makeThumbs(){
  casR.setSize(112,112,false);const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight(0xffffff,0x8899aa,1));const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(3,5,4);sc.add(dl);
  const cm=new THREE.PerspectiveCamera(30,1,.1,50);
  for(const id in CATALOG){const g=new THREE.Group();CATALOG[id].build(g,CATALOG[id].colors[0],null);sc.add(g);const b=new THREE.Box3().setFromObject(g);const c=b.getCenter(new THREE.Vector3());const s=b.getSize(new THREE.Vector3()).length();cm.position.set(c.x+s*1.15,c.y+s*.85,c.z+s*1.6);cm.lookAt(c);casR.render(sc,cm);thumbs[id]=casR.domElement.toDataURL();sc.remove(g);}
}

/* ============ menus ============ */
function showMenu(){
  if(state&&state.started){state.started=false;}
  clearWorld();state=freshState();defaultLot();buildFloors();computeWallBounds();rebuildWalls(true);
  // demo sims wandering on the menu backdrop
  state.sims=[initSimRuntime(Object.assign(newSimData({body:'f'}),{id:1,last:'Demo'})),initSimRuntime(Object.assign(newSimData({body:'m'}),{id:2,last:'Demo'}))];
  state.active=null;state.menuDemo=true;
  $('#menu').hidden=false;$('#cas').hidden=true;$('#hud').style.visibility='hidden';
  $('#btnContinue').hidden=!readSave();
}
function enterGame(){
  state.menuDemo=false;$('#menu').hidden=true;$('#hud').style.visibility='visible';
  setModeForce('live');refreshHousehold();refreshCard();refreshPanel();refreshQueue();refreshSpeed();updateClock();
}
function setModeForce(m){state.mode=m==='live'?'buy':'live';setMode(m);state.speed=1;refreshSpeed();}
$('#btnNew').onclick=()=>openCAS('new');
$('#btnContinue').onclick=()=>{const d=readSave();if(d)loadGame(d);};
$('#btnHelp').onclick=openHelp;

/* ============ main loop ============ */
let last=performance.now(),uiT=0;
function tick(now){
  requestAnimationFrame(tick);
  const dtR=Math.min(.1,(now-last)/1000);last=now;
  if(casOpen){if(casMesh){casMesh.g.rotation.y=casYaw+Math.sin(now/1500)*.15;casMesh.animT=(casMesh.animT||0)+dtR;}casR.render(casScene,casCam);}
  if(!state)return;
  // keyboard pan
  const kp=420*dtR;if(keys['w']||keys['arrowup'])pan(0,kp);if(keys['s']||keys['arrowdown'])pan(0,-kp);if(keys['a']||keys['arrowleft'])pan(kp,0);if(keys['d']||keys['arrowright'])pan(-kp,0);
  if(state.menuDemo){cam.yaw+=dtR*.05;}
  applyCam();
  const rate=[0,1,3,10][state.speed]||0;
  const dtG=state.mode==='live'?dtR*rate:0;
  const dtM=dtR*[0,1,2,3.4][state.speed];
  if(dtG>0){
    state.time+=dtG;
    const h=Math.floor(state.time/60);
    if(!state.menuDemo)while(state.lastHour<h){state.lastHour++;onHour(state.lastHour);}else state.lastHour=h;
  }
  for(const s of allSims())updateSim(s,dtG,dtM,state.speed?dtR:0);
  for(let i=state.puddles.length-1;i>=0;i--){if(state.puddles[i].until<state.time){fxGroup.remove(state.puddles[i].m);state.puddles.splice(i,1);}}
  const a=state.active;
  if(a&&!a.atWork&&state.mode==='live'){const h=headPos(a);plumbob.visible=true;plumbob.position.set(h.x,h.y+.18+Math.sin(now/400)*.04,h.z);plumbob.rotation.y+=dtR*1.6;}else plumbob.visible=false;
  rebuildWalls(false);updateSky();
  renderer.render(scene,camera);
  if(!state.menuDemo){updateOverlays();uiT-=dtR;if(uiT<=0){uiT=.2;updateClock();updateCardLive();updateNeeds();updateQueueProgress();}}
}

/* ============ boot ============ */
function start(hot){
  resize();makeThumbs();
  const d=hot&&hot.save;
  if(d)loadGame(d);else showMenu();
  requestAnimationFrame(tick);
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({save:serialize()}));
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
window.addEventListener('beforeunload',()=>saveGame(true));
})();
</script>
